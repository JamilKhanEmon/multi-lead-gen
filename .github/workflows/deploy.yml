name: CI/CD Pipeline - Build, Test & Deploy to VPS

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ==============================================================================
  # Job 1: Build & Push Docker Images to GitHub Container Registry (GHCR)
  # ==============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Name
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 1. Build & Push Backend & Worker Image ---
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/leadgenai-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/leadgenai-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 2. Build & Push Next.js Frontend Image ---
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || '/api/v1' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/leadgenai-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/leadgenai-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================================
  # Job 2: Deploy to VPS via SSH
  # ==============================================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.repository == 'NIBIZ-SOFT/leadgenai'
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: ENV_FILE
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/var/www/leadgenai' }}"
            
            echo "==> Deploying to $DEPLOY_PATH on VPS..."
            
            # 1. Create or navigate to project directory
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Directory does not exist. Cloning repository..."
              git clone https://github.com/NIBIZ-SOFT/leadgenai.git "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
            else
              cd "$DEPLOY_PATH"
              echo "Fetching latest changes..."
              git fetch --all
              git reset --hard origin/main || git reset --hard origin/master
            fi

            # 2. Inject real production .env from GitHub Secrets if configured
            if [ -n "$ENV_FILE" ]; then
              echo "==> Updating .env from GitHub Secrets..."
              printf '%s\n' "$ENV_FILE" > "$DEPLOY_PATH/.env"
            fi

            # 3. Build & start production services
            echo "==> Building and starting production containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # 4. Clean up old dangling images to save VPS disk space
            docker image prune -f

            echo "==> Deployment Successfully Completed!"
